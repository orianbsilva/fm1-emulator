# The unit tests (the update protocol against the reference's bytes) and a debug APK on every push; on a v* tag, the
# APK attached to the tag's release (a pre-release while the version is 0.x).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Platform 37 (the runner's SDK)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: Tests and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ObsLoader-${GITHUB_REF_NAME//\//-}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ObsLoader-apk
          path: ObsLoader-*-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ObsLoader-apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" ObsLoader-*-debug.apk --repo "$GITHUB_REPOSITORY" --title "ObsLoader ${GITHUB_REF_NAME#v}" --generate-notes $pre
