# The unit tests (the update protocol against the reference's bytes) and a debug APK on every push. The release APK
# is signed with the project's key on the maker's machine and attached to the tag's release from there.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Platform 37 (the runner's SDK)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: Tests and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ObsLoader-${GITHUB_REF_NAME//\//-}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ObsLoader-apk
          path: ObsLoader-*-debug.apk

